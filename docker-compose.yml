services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Diambil dari --env-file .env.production saat build.
        # env_file pada service hanya berlaku saat container berjalan.
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY
    image: fintrack:latest
    container_name: fintrack
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - web
    ports:
      # Browser-facing Next.js. Put a reverse proxy (Caddy / Nginx /
      # Cloudflare Tunnel) in front of this in production for TLS
      # and a real domain.
      - "127.0.0.1:3003:3000"
      # Uncomment the line below ONLY if you want the backend to be
      # directly reachable from the host or a sibling service. The
      # default setup keeps the backend internal and uses the
      # Next.js rewrite to proxy /api/* instead.
      # - "4000:4000"
    volumes:
      # Persist the WhatsApp pairing session so `docker compose up
      # --build` doesn't force you to re-scan the QR code every time.
      - whatsapp-session:/app/.baileys-session
      # Persist the disk-backed Yahoo Finance cache. Without this, a
      # fresh image wipes the last known good quotes and the user
      # has to wait for Yahoo to answer again — which often never
      # happens from a VPS IP.
      - fintrack-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      # Cap each log file at 10 MB and keep 5 rotated files. Without this
      # the container writes to a single json-file that grows until the
      # disk fills up, which is the #1 cause of mysterious prod outages
      # for long-lived Node services.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  fintrack-data:
    external: true
    name: fintrack_fintrack-data
  whatsapp-session:
    external: true
    name: fintrack_whatsapp-session
networks:
  web:
    external: true
