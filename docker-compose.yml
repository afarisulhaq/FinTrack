# FinTrack and QRIS Gateway production deploy.
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. edit .env.production (isi database, JWT, TURNSTILE_SECRET_KEY dll.)
#   3. docker compose --env-file .env.production up -d --build
#   4. docker compose logs -f app   # to watch the first boot
#
# The image does NOT include Postgres. Set DATABASE_URL to an
# external DB (managed, RDS, Supabase, your own VPS, etc.) and the
# backend will connect to it on startup.
#
# FinTrack publishes port 3000; the gateway dashboard binds to localhost:3010.
# The Elysia backend stays on the
# internal network on port 4000 and is reached through Next.js's
# `/api/*` rewrite (see next.config.mjs).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Diambil dari --env-file .env.production saat build.
        # env_file pada service hanya berlaku saat container berjalan.
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY
    image: fintrack:latest
    container_name: fintrack
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GOPAY_GATEWAY_URL: http://qris-gateway:3010
    depends_on:
      qris-gateway:
        condition: service_healthy
    networks:
      - web
      - gateway
    ports:
      # Browser-facing Next.js. Put a reverse proxy (Caddy / Nginx /
      # Cloudflare Tunnel) in front of this in production for TLS
      # and a real domain.
      - "3000:3000"
      # Uncomment the line below ONLY if you want the backend to be
      # directly reachable from the host or a sibling service. The
      # default setup keeps the backend internal and uses the
      # Next.js rewrite to proxy /api/* instead.
      # - "4000:4000"
    volumes:
      # Persist the WhatsApp pairing session so `docker compose up
      # --build` doesn't force you to re-scan the QR code every time.
      - whatsapp-session:/app/.baileys-session
      # Persist the disk-backed Yahoo Finance cache. Without this, a
      # fresh image wipes the last known good quotes and the user
      # has to wait for Yahoo to answer again — which often never
      # happens from a VPS IP.
      - fintrack-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      # Cap each log file at 10 MB and keep 5 rotated files. Without this
      # the container writes to a single json-file that grows until the
      # disk fills up, which is the #1 cause of mysterious prod outages
      # for long-lived Node services.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  qris-gateway:
    build:
      context: ./qris-gateway
      dockerfile: Dockerfile
    image: fintrack-qris-gateway:latest
    restart: unless-stopped
    networks:
      - gateway
    environment:
      HOST: 0.0.0.0
      PORT: 3010
      DATA_DIR: /app/data
      PUBLIC_URL: ${QRIS_GATEWAY_PUBLIC_URL:-http://127.0.0.1:3010}
      SECURE_COOKIES: ${QRIS_GATEWAY_SECURE_COOKIES:-false}
    ports:
      - "127.0.0.1:${QRIS_GATEWAY_PORT:-3010}:3010"
    volumes:
      - qris-gateway-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  whatsapp-session:
  fintrack-data:
  qris-gateway-data:

networks:
  web:
    external: true
  gateway:
